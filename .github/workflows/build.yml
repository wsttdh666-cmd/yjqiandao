name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VC: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE }}" | tr -d ' \r\n' | base64 -d > android/app/sign.jks || { echo "::error::钥匙解码失败 长度 $(printf '%s' "${{ secrets.KEYSTORE }}" | wc -c)"; exit 1; }
          keytool -list -keystore android/app/sign.jks -storepass qiandao > /dev/null || { echo "::error::钥匙打不开 大小 $(wc -c < android/app/sign.jks)"; exit 1; }
      - run: sed -i "s/const VER = 0;/const VER = $VC;/" www/index.html
      - run: npm ci
      - run: npx cap sync android
      - name: build
        run: |
          cd android
          ./gradlew assembleDebug > ../build.log 2>&1 || { echo "::error::$(grep -E 'error|What went wrong' -A3 ../build.log | head -c 1500 | tr '\n' ' ')"; exit 1; }
      - run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qiandao.apk
          echo $VC > version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            qiandao.apk
            version.txt
  release:
    needs: apk
    runs-on: ubuntu-latest
    env:
      VC: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --limit 200 --json tagName -q '.[].tagName'); do gh release delete "$t" -y --cleanup-tag; done
          gh release create v$VC qiandao.apk version.txt $(ls qiandao.ipa 2>/dev/null) -t "版本 $VC" -n "$(git log -1 --pretty=%s)" --latest 2> rel.log || { echo "::error::$(tr '\n' ' ' < rel.log)"; exit 1; }
      # 国内下载快：同一个包再发一份到 Gitee，只留最新一版
      - name: gitee
        continue-on-error: true
        env:
          GT: ${{ secrets.GITEE_TOKEN }}
        run: |
          R=https://gitee.com/api/v5/repos/xxuovo/yjqiandao
          for id in $(curl -sf "$R/releases?access_token=$GT&per_page=100" | jq -r '.[].id'); do
            curl -sf -X DELETE "$R/releases/$id?access_token=$GT" > /dev/null
          done
          BR=$(curl -sf "$R?access_token=$GT" | jq -r .default_branch)
          ID=$(curl -s -X POST "$R/releases" --form-string access_token=$GT --form-string tag_name=v$VC --form-string name="版本 $VC" --form-string body="$(git log -1 --pretty=%s)" --form-string target_commitish=$BR | tee rel.json | jq -r .id)
          [ "$ID" != null ] || { echo "::error::Gitee 建发行版失败 $(cat rel.json)"; exit 1; }
          for f in qiandao.apk version.txt; do
            curl -sf -X POST "$R/releases/$ID/attach_files" --form-string access_token=$GT -F file=@$f > /dev/null || { echo "::error::Gitee 传 $f 失败"; exit 1; }
          done
          curl -sfL -o check.apk https://gitee.com/xxuovo/yjqiandao/releases/download/v$VC/qiandao.apk
          [ "$(wc -c < check.apk)" = "$(wc -c < qiandao.apk)" ] || { echo "::error::Gitee 上的包下载下来大小不对"; exit 1; }
          echo "Gitee 发布并试下载成功"
